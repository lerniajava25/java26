<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Studenthantering</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">

<div th:replace="~{fragments/nav :: nav}"></div>

<h1 class="mb-4">Studenter</h1>

<table class="table table-striped table-bordered">
    <thead class="table-dark">
    <tr>
        <th>ID</th>
        <th>Namn</th>
        <th>Kurser</th>
        <th>Tilldela</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="student : ${students}">
        <td th:text="${student.id}">1</td>
        <td th:text="${student.name}">John</td>
        <td>
            <span th:each="course, iter : ${student.courses}">
                <span th:text="${course.title}" th:classappend="${iter.last} ? '' : ' me-2'">Java</span>
                <form th:action="@{'/students/' + ${student.id} + '/remove-course/' + ${course.id}}"
                      method="post" class="d-inline ms-1">
                    <button type="submit" class="btn btn-sm btn-outline-danger" title="Ta bort">×</button>
                </form>
            </span>
            <span th:if="${student.courses.empty}">Inga kurser</span>
        </td>
        <td>
            <span th:each="course : ${courses}">
                <form th:if="${!student.courses.contains(course)}"
                      th:action="@{'/students/' + ${student.id} + '/courses/' + ${course.id}}"
                      method="post" class="d-inline">
                    <button type="submit" class="btn btn-sm btn-outline-success"
                            th:attr="title=${course.title}"
                            th:text="${course.title}">Java</button>
                </form>
            </span>
        </td>
    </tr>
    </tbody>
</table>

<div class="card mt-5">
    <div class="card-header">Lägg till ny student</div>
    <div class="card-body">
        <form th:action="@{/students}" th:object="${student}" method="post">
            <div class="mb-3">
                <label class="form-label">Namn:</label>
                <input type="text" th:field="*{name}" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary">Spara i databas</button>
        </form>
    </div>
</div>

</body>
</html>
