<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Kurshantering</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">

<h1 class="mb-4">Kurser (Server-renderat med Thymeleaf)</h1>

<!-- Tabell som loopar igenom kurserna från databasen -->
<table class="table table-striped table-bordered">
    <thead class="table-dark">
    <tr>
        <th>ID</th>
        <th>Titel</th>
        <th>Poäng</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="course : ${courses}">
        <td th:text="${course.id}">1</td>
        <td th:text="${course.title}">Java Systems Development</td>
        <td th:text="${course.credits}">15</td>
    </tr>
    </tbody>
</table>

<!-- Formulär för att lägga till ny kurs (testar JPA write + databas) -->
<div class="card mt-5">
    <div class="card-header">Lägg till ny kurs</div>
    <div class="card-body">
        <form th:action="@{/courses}" th:object="${course}" method="post">
            <div class="mb-3">
                <label class="form-label">Titel:</label>
                <input type="text" th:field="*{title}" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Poäng:</label>
                <input type="number" th:field="*{credits}" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary">Spara i databas</button>
        </form>
    </div>
</div>

</body>
</html>
