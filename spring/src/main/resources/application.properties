spring.application.name=spring
spring.docker.compose.file=./spring/compose.yaml
spring.docker.compose.lifecycle-management=start_only
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
#spring.jpa.show-sql=true
api.enabled=true
spring.security.oauth2.client.registration.authserver.client-id=oidc-client
spring.security.oauth2.client.registration.authserver.client-secret=secret
spring.security.oauth2.client.registration.authserver.scope=openid,profile
spring.security.oauth2.client.provider.authserver.issuer-uri=http://localhost:9000
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:9000
