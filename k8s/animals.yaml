apiVersion: apps/v1
kind: Deployment
metadata:
  name: animals
  labels:
    app: animals
spec:
  replicas: 1
  selector:
    matchLabels:
      app: animals
  template:
    metadata:
      name: animals
      labels:
        app: animals
    spec:
      containers:
        - name: animal
          image: animals:1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              protocol: TCP
          env:
            - name: DB_URL
              value: jdbc:mysql://mysql.mysql.svc.cluster.local:3306/mydb
            - name: DB_USER
              value: user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: password
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: animal-service
spec:
  type: NodePort
  selector:
    app: animals
  ports:
    - port: 80
      targetPort: 8080
      nodePort: 30001
