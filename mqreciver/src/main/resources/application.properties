spring.application.name=mqreciver
server.port=8000
spring.rabbitmq.addresses=amqp://myuser:secret@localhost
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
# Inbox consumer settings
# Set to true to simulate processing failures (for testing DLQ behavior)
inbox.simulate-process-error=false
